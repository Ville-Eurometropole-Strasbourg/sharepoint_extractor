services:
  spx-extractor:
    build: .
    networks:
      - spx_net
    volumes:
      - .:/app
    environment:
      - SPX_SITE_URL=${SPX_SITE_URL}
      - SPX_USERNAME=${SPX_USERNAME}
      - SPX_PASSWORD=${SPX_PASSWORD}
      - SPX_CA_BUNDLE=${SPX_CA_BUNDLE:-}
      - SPX_INSPECT_PATH=${SPX_INSPECT_PATH:-}
      - SPX_INSPECT_LIST=${SPX_INSPECT_LIST:-}
      - SPX_ROOT_NAME=${SPX_ROOT_NAME}
      - SPX_OUTPUT_DIR=${SPX_OUTPUT_DIR:-./discovery_output}
      - SPX_MONITOR_DB=${SPX_MONITOR_DB:-}
  grafana:
    image: grafana/grafana:latest
    container_name: spx-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    volumes:
      - ${SPX_OUTPUT_DIR:-./discovery_output}:/app/discovery_output
      - grafana-data:/var/lib/grafana
    restart: unless-stopped
volumes:
  grafana-data:

networks:
  spx_net:
    driver: bridge
    ipam:
      config:
        - subnet: ${SPX_DOCKER_SUBNET:-10.200.0.0/24}
